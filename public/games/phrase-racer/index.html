<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c100e" />
<title>Phrase Racer — BizEnglish</title>
<style>
  :root {
    --bg: #0c100e;
    --card: #171c19;
    --primary: #22c55e;
    --primary-dark: #15803d;
    --primary-fg: #0c100e;
    --border: #272e29;
    --muted: #8a8f8c;
    --fg: #e9ece9;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
  }

  /* ── Top 2/3: canvas runner ── */
  #canvas-wrap {
    position: relative;
    flex: 2 1 0;
    min-height: 0;
    overflow: hidden;
    background: var(--bg);
  }
  #game-canvas { position: absolute; inset: 0; display: block; }

  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: calc(10px + env(safe-area-inset-top)) 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hud-chip {
    background: rgba(12, 16, 14, 0.72);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  #hud-lives { color: var(--red); letter-spacing: 1px; }
  #hud-speed { color: var(--fg); }
  #hud-distance { color: var(--amber); }
  #nitro-badge {
    align-self: center;
    background: linear-gradient(90deg, #38bdf8, #22c55e);
    color: #06170e;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1.5px;
    padding: 3px 12px;
    border-radius: 999px;
    transition: opacity 0.15s ease;
  }
  #nitro-badge.hidden { opacity: 0; }
  #timer-bar-wrap {
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  #timer-bar {
    height: 100%;
    width: 100%;
    background: var(--primary);
    transform-origin: left center;
    transform: scaleX(1);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    background: rgba(12, 16, 14, 0.92);
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .overlay h1 span { color: var(--primary); }
  .overlay p { margin: 0; font-size: 13px; color: var(--muted); max-width: 320px; line-height: 1.5; }
  .overlay button {
    margin-top: 8px;
    background: var(--primary);
    color: var(--primary-fg);
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .overlay button:active { transform: scale(0.97); }
  #final-distance { color: var(--amber); font-weight: 800; }

  /* ── Bottom 1/3: word matching puzzle ── */
  #puzzle-wrap {
    flex: 1 1 0;
    min-height: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .puzzle-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  #sentence {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 5px;
    font-size: 15px;
    line-height: 1.4;
  }
  .word-text { color: var(--fg); }
  .slot {
    min-width: 56px;
    height: 30px;
    padding: 0 8px;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--fg);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .slot.filled {
    border-style: solid;
    border-color: var(--primary);
    background: rgba(34, 197, 94, 0.12);
    color: var(--primary);
  }
  #pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 2px;
  }
  .pool-word {
    border: 1px solid var(--border);
    background: #1d2320;
    color: var(--fg);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .pool-word:active { transform: scale(0.96); }
  .pool-word.used { opacity: 0.25; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .overlay button, .pool-word { transition: none; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>

      <div id="hud">
        <div class="hud-top">
          <div id="hud-lives" class="hud-chip">❤️❤️❤️</div>
          <div id="hud-distance" class="hud-chip">0 m</div>
          <div id="hud-speed" class="hud-chip">20 km/h</div>
        </div>
        <div id="nitro-badge" class="hidden">⚡ NITRO</div>
        <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
      </div>

      <div id="start-screen" class="overlay">
        <h1>Phrase <span>Racer</span></h1>
        <p>
          Fill in the missing words of each business phrase before the clock
          runs out. Get it right to speed up — get it wrong and you'll crash.
          3 in a row triggers NITRO. 10 in a row earns an extra life.
        </p>
        <button id="start-btn" type="button">Start Race</button>
      </div>

      <div id="gameover-screen" class="overlay hidden">
        <h1>Game <span>Over</span></h1>
        <p>Final distance: <span id="final-distance">0</span> m</p>
        <button id="restart-btn" type="button">Play Again</button>
      </div>
    </div>

    <div id="puzzle-wrap">
      <div class="puzzle-label">Fill in the blanks</div>
      <div id="sentence"></div>
      <div class="puzzle-label">Word bank</div>
      <div id="pool"></div>
    </div>
  </div>

<script>
"use strict";

// ── Config ──────────────────────────────────────────────────────────────
const CONFIG = {
  QUESTION_MS: 30000,
  START_LIVES: 3,
  START_SPEED: 20,
  SPEED_UP: 5,
  SPEED_DOWN: 5,
  SPEED_MIN: 10,
  NITRO_STREAK: 3,
  NITRO_MULT: 2,
  EXTRA_LIFE_STREAK: 10,
  DISTANCE_K: 0.277,
  PX_PER_KMH: 6,
  MAX_SCROLL_PX_S: 900,
  MAX_DT_MS: 50,
  CRASH: { APPROACH: 180, SHAKE: 520, HOLD: 1700, FADE: 300, TOTAL: 2000 },
  HOP: 350,
};

const COLORS = {
  skyTop: "#0f1512",
  skyBottom: "#0c100e",
  treeFar: "#1c2420",
  treeNear: "#233028",
  road: "#1b201d",
  roadLine: "#3a4a3f",
  primary: "#22c55e",
  primaryDark: "#15803d",
  amber: "#f59e0b",
  destructive: "#ef4444",
};

const TREE_FAR_SPACING = 140;
const TREE_NEAR_SPACING = 90;
const ROAD_DASH = 40;

// ── Mock phrase data ───────────────────────────────────────────────────
const RAW_QUESTIONS = [
  { sentence: "Your new boss is _ real _ _ _", answer: ["A", "piece", "of", "work"] },
  { sentence: "We need to think outside the _ for this campaign.", answer: ["box"] },
  { sentence: "Let's touch _ next week to review progress.", answer: ["base"] },
  { sentence: "Can you give me a _ _ before we finalize the budget?", answer: ["ballpark", "figure"] },
  { sentence: "Let's make sure we're all _ _ _ _ before the meeting.", answer: ["on", "the", "same", "page"] },
  { sentence: "New hires need to _ _ _ _ from day one.", answer: ["hit", "the", "ground", "running"] },
];

const DECOY_WORDS = [
  "quickly", "meeting", "project", "never", "budget", "team",
  "quarter", "office", "carefully", "tomorrow", "deadline", "client",
];

function normalizeWord(w) { return w.toLowerCase().replace(/[^a-z]/g, ""); }

// Defensive: keep only questions whose blank count matches their answer length.
const QUESTIONS = RAW_QUESTIONS.filter(
  (q) => q.sentence.split(" ").filter((t) => t.startsWith("_")).length === q.answer.length
);

// ── State ───────────────────────────────────────────────────────────────
function buildDeck() { return shuffle(QUESTIONS); }

function initialState() {
  return {
    phase: "READY", // READY | PLAYING | CRASHING | GAMEOVER
    lives: CONFIG.START_LIVES,
    speed: CONFIG.START_SPEED,
    streak: 0,
    distanceM: 0,
    deck: buildDeck(),
    deckIndex: 0,
    questionSerial: 0,
    nitroSerial: 0,
    timeLeftMs: CONFIG.QUESTION_MS,
    crashMs: 0,
    crashImpactPlayed: false,
    crashApproachSpeed: 0,
    crashPhraseText: "",
    hopMs: null,
    wheelAngle: 0,
    run: null,
    scroll: { far: 0, near: 0, road: 0 },
    reducedMotion:
      typeof window.matchMedia === "function" &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches,
  };
}

let state = initialState();

// ── Derived values ─────────────────────────────────────────────────────
function nitroActive() { return state.nitroSerial >= state.questionSerial; }
function effectiveSpeed() { return state.speed * (nitroActive() ? CONFIG.NITRO_MULT : 1); }
function remainingSeconds() { return Math.ceil(state.timeLeftMs / 1000); }
function isNitroTrigger(streak) { return streak === CONFIG.NITRO_STREAK; }
function isExtraLifeTrigger(streak) { return streak === CONFIG.EXTRA_LIFE_STREAK; }

// ── Utilities ───────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDecoy(answer) {
  const answerNorm = new Set(answer.map(normalizeWord));
  const candidates = DECOY_WORDS.filter((w) => !answerNorm.has(normalizeWord(w)));
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function parseSentence(q) {
  const parts = q.sentence.split(" ");
  let ai = 0;
  const tokens = parts.map((p) => {
    if (p.startsWith("_")) {
      return { type: "blank", answerIndex: ai++, suffix: p.slice(1) };
    }
    return { type: "text", text: p };
  });
  return { tokens, blankCount: ai };
}

function buildRun(q, decoyWord) {
  const { tokens, blankCount } = parseSentence(q);
  const items = q.answer.map((w) => ({ word: w, isDecoy: false }));
  items.push({ word: decoyWord, isDecoy: true });
  const shuffled = shuffle(items);
  const pool = shuffled.map((it, i) => ({ id: i, word: it.word, isDecoy: it.isDecoy, used: false }));
  return { q, tokens, blankCount, decoyWord, pool, slots: new Array(blankCount).fill(null) };
}

function freshRun(q) { return buildRun(q, pickDecoy(q.answer)); }
function retryRun(run) { return buildRun(run.q, run.decoyWord); }

// ── Audio (standalone Web Audio synthesis, no asset files) ───────────────
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

let sessionAudioEl = null;
function holdPlaybackAudioSession() {
  if (sessionAudioEl) return;
  try {
    sessionAudioEl = new Audio(
      "data:audio/wav;base64,UklGRiwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQgAAACAgICAgICAgA=="
    );
    sessionAudioEl.loop = true;
    sessionAudioEl.volume = 0.01;
    sessionAudioEl.play().catch(() => {});
  } catch (e) { /* audio unavailable, sound is non-essential */ }
}

function unlockAudio() {
  try {
    const ctx = getCtx();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    holdPlaybackAudioSession();
  } catch (e) { /* Web Audio unavailable, game still playable without sound */ }
}

function tone(freq, startTime, duration, opts) {
  opts = opts || {};
  const type = opts.type || "sine";
  const gainVal = opts.gain != null ? opts.gain : 0.15;
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    if (opts.glideTo != null) osc.frequency.exponentialRampToValueAtTime(opts.glideTo, startTime + duration);
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(gainVal, startTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(startTime); osc.stop(startTime + duration + 0.02);
  } catch (e) { /* ignore */ }
}

function noiseBurst(startTime, duration, opts) {
  opts = opts || {};
  const gainVal = opts.gain != null ? opts.gain : 0.15;
  const filterType = opts.filterType || "bandpass";
  const freq = opts.freq != null ? opts.freq : 2000;
  const q = opts.q != null ? opts.q : 1;
  try {
    const ctx = getCtx();
    const bufSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.setValueAtTime(freq, startTime);
    filter.Q.value = q;
    if (opts.freqEnd != null) filter.frequency.exponentialRampToValueAtTime(opts.freqEnd, startTime + duration);
    const g = ctx.createGain();
    const attack = Math.min(0.02, duration / 4);
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(gainVal, startTime + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    src.connect(filter); filter.connect(g); g.connect(ctx.destination);
    src.start(startTime); src.stop(startTime + duration + 0.02);
  } catch (e) { /* ignore */ }
}

function sfxVroom() {
  const ctx = getCtx(); const t = ctx.currentTime;
  tone(320, t, 0.32, { type: "sawtooth", gain: 0.11, glideTo: 900 });
}
function sfxCrash() {
  const ctx = getCtx(); const t = ctx.currentTime;
  noiseBurst(t, 0.35, { gain: 0.32, filterType: "lowpass", freq: 1200, freqEnd: 200, q: 1 });
  tone(85, t, 0.3, { type: "sine", gain: 0.22, glideTo: 45 });
}
function sfxNitro() {
  const ctx = getCtx(); const t = ctx.currentTime;
  tone(400, t, 0.4, { type: "sawtooth", gain: 0.13, glideTo: 1400 });
  noiseBurst(t + 0.05, 0.3, { gain: 0.1, filterType: "highpass", freq: 2000 });
}
function sfxExtraLife() {
  const ctx = getCtx(); const t = ctx.currentTime;
  tone(880, t, 0.15, { gain: 0.15 });
  tone(1174.66, t + 0.12, 0.25, { gain: 0.15 });
}
function sfxGameOver() {
  const ctx = getCtx(); const t = ctx.currentTime;
  tone(400, t, 0.3, { type: "triangle", gain: 0.15, glideTo: 180 });
  tone(300, t + 0.25, 0.4, { type: "triangle", gain: 0.15, glideTo: 120 });
}

// ── Puzzle DOM ──────────────────────────────────────────────────────────
const sentenceEl = document.getElementById("sentence");
const poolEl = document.getElementById("pool");

function firstEmptySlot() { return state.run.slots.findIndex((s) => s == null); }

function renderPuzzle() {
  const run = state.run;
  sentenceEl.innerHTML = "";
  run.tokens.forEach((tok) => {
    if (tok.type === "text") {
      const span = document.createElement("span");
      span.className = "word-text";
      span.textContent = tok.text;
      sentenceEl.appendChild(span);
      return;
    }
    const filledId = run.slots[tok.answerIndex];
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "slot" + (filledId != null ? " filled" : "");
    btn.dataset.answerIndex = String(tok.answerIndex);
    btn.textContent = filledId != null ? run.pool.find((p) => p.id === filledId).word : "";
    sentenceEl.appendChild(btn);
    if (tok.suffix) {
      const suf = document.createElement("span");
      suf.className = "word-text";
      suf.textContent = tok.suffix;
      sentenceEl.appendChild(suf);
    }
  });

  poolEl.innerHTML = "";
  run.pool.forEach((item) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pool-word" + (item.used ? " used" : "");
    btn.textContent = item.word;
    btn.dataset.id = String(item.id);
    poolEl.appendChild(btn);
  });
}

function onPoolClick(id) {
  if (state.phase !== "PLAYING") return;
  const item = state.run.pool.find((p) => p.id === id);
  if (!item || item.used) return;
  const idx = firstEmptySlot();
  if (idx === -1) return;
  state.run.slots[idx] = id;
  item.used = true;
  renderPuzzle();
  if (state.run.slots.every((s) => s != null)) validate();
}

function onSlotClick(answerIndex) {
  if (state.phase !== "PLAYING") return;
  const id = state.run.slots[answerIndex];
  if (id == null) return;
  const item = state.run.pool.find((p) => p.id === id);
  item.used = false;
  state.run.slots[answerIndex] = null;
  renderPuzzle();
}

function validate() {
  const guess = state.run.slots.map((id) => state.run.pool.find((p) => p.id === id).word);
  const answer = state.run.q.answer;
  const correct = guess.length === answer.length && guess.every((w, i) => w === answer[i]);
  if (correct) resolveCorrect(); else resolveWrong("wrong");
}

// ── Game transitions ────────────────────────────────────────────────────
function loadQuestion(opts) {
  const retry = !!(opts && opts.retry);
  state.questionSerial++;
  if (retry) {
    state.run = retryRun(state.run);
  } else {
    if (state.deckIndex >= state.deck.length) {
      state.deck = buildDeck();
      state.deckIndex = 0;
    }
    const q = state.deck[state.deckIndex++];
    state.run = freshRun(q);
  }
  state.timeLeftMs = CONFIG.QUESTION_MS;
  state.phase = "PLAYING";
  renderPuzzle();
}

function resolveCorrect() {
  state.streak += 1;
  state.speed += CONFIG.SPEED_UP;
  const scoringSpeed = effectiveSpeed();
  state.distanceM += scoringSpeed * remainingSeconds() * CONFIG.DISTANCE_K;
  state.hopMs = 0;
  sfxVroom();
  if (isNitroTrigger(state.streak)) {
    state.nitroSerial = state.questionSerial + 1;
    sfxNitro();
  }
  if (isExtraLifeTrigger(state.streak)) {
    state.lives += 1;
    sfxExtraLife();
  }
  loadQuestion({ retry: false });
}

function resolveWrong() {
  state.streak = 0;
  state.lives = Math.max(0, state.lives - 1);
  state.speed = Math.max(CONFIG.SPEED_MIN, state.speed - CONFIG.SPEED_DOWN);
  state.phase = "CRASHING";
  state.crashMs = 0;
  state.crashImpactPlayed = false;
  state.crashPhraseText = state.run.q.answer.join(" ");
  state.crashApproachSpeed = effectiveSpeed();
}

function finishCrash() {
  if (state.lives > 0) {
    loadQuestion({ retry: true });
  } else {
    gameOver();
  }
}

function gameOver() {
  state.phase = "GAMEOVER";
  document.getElementById("final-distance").textContent = Math.round(state.distanceM);
  document.getElementById("gameover-screen").classList.remove("hidden");
  sfxGameOver();
}

function startGame() {
  unlockAudio();
  document.getElementById("start-screen").classList.add("hidden");
  document.getElementById("gameover-screen").classList.add("hidden");
  loadQuestion({ retry: false });
  ensureLoopRunning();
}

function restart() {
  state = initialState();
  document.getElementById("gameover-screen").classList.add("hidden");
  startGame();
}

// ── Canvas setup ────────────────────────────────────────────────────────
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");
const canvasWrap = document.getElementById("canvas-wrap");
let cssW = 0, cssH = 0;

function resizeCanvas() {
  cssW = canvasWrap.clientWidth;
  cssH = canvasWrap.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ── Scroll / physics ────────────────────────────────────────────────────
function advanceScroll(speedKmh, dt) {
  const pxPerSec = Math.min(speedKmh * CONFIG.PX_PER_KMH, CONFIG.MAX_SCROLL_PX_S);
  const d = (pxPerSec * dt) / 1000;
  state.scroll.road = (state.scroll.road + d) % ROAD_DASH;
  state.scroll.near = (state.scroll.near + d * 0.6) % TREE_NEAR_SPACING;
  state.scroll.far = (state.scroll.far + d * 0.3) % TREE_FAR_SPACING;
}

// ── Crash timing helpers (pure functions of crashMs) ──────────────────────
function shakeOffset(crashMs) {
  const c = CONFIG.CRASH;
  if (crashMs < c.APPROACH) return { x: 0, y: 0 };
  const t = (crashMs - c.APPROACH) / c.SHAKE;
  if (t >= 1) return { x: 0, y: 0 };
  const amp = 8 * (1 - t);
  return { x: (Math.random() * 2 - 1) * amp, y: (Math.random() * 2 - 1) * amp };
}
function carFlashOn(crashMs) {
  const c = CONFIG.CRASH;
  if (crashMs < c.APPROACH || crashMs > c.APPROACH + c.SHAKE) return false;
  const t = crashMs - c.APPROACH;
  return Math.floor(t / 90) % 2 === 0;
}
function barricadeAlpha(crashMs) {
  const c = CONFIG.CRASH;
  if (crashMs < c.HOLD) return 1;
  const t = (crashMs - c.HOLD) / c.FADE;
  return Math.max(0, 1 - t);
}
function barricadeX(carX, crashMs) {
  const c = CONFIG.CRASH;
  const startX = carX + 260;
  const endX = carX + 90;
  if (crashMs >= c.APPROACH) return endX;
  const t = crashMs / c.APPROACH;
  return startX + (endX - startX) * t;
}

// ── Update (logic; writes state only) ─────────────────────────────────────
function update(dt) {
  if (state.phase === "PLAYING") {
    state.wheelAngle += effectiveSpeed() * 0.0025 * dt;
    advanceScroll(effectiveSpeed(), dt);
    if (state.hopMs != null) {
      state.hopMs += dt;
      if (state.hopMs > CONFIG.HOP) state.hopMs = null;
    }
    state.timeLeftMs -= dt;
    if (state.timeLeftMs <= 0) {
      state.timeLeftMs = 0;
      resolveWrong("timeout");
    }
  } else if (state.phase === "CRASHING") {
    const c = CONFIG.CRASH;
    const prevMs = state.crashMs;
    state.crashMs += dt;
    if (state.crashMs < c.APPROACH) {
      const t = state.crashMs / c.APPROACH;
      advanceScroll(state.crashApproachSpeed * (1 - t), dt);
    }
    if (prevMs < c.APPROACH && state.crashMs >= c.APPROACH && !state.crashImpactPlayed) {
      state.crashImpactPlayed = true;
      sfxCrash();
    }
    if (state.crashMs >= c.TOTAL) finishCrash();
  }
}

// ── Render (canvas + HUD; reads state only) ────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTreeShape(x, baseY, r, height) {
  ctx.beginPath();
  ctx.moveTo(x, baseY);
  ctx.lineTo(x - r, baseY);
  ctx.lineTo(x, baseY - height);
  ctx.lineTo(x + r, baseY);
  ctx.closePath();
  ctx.fill();
}

function drawSky(w, roadTop) {
  const g = ctx.createLinearGradient(0, 0, 0, roadTop);
  g.addColorStop(0, COLORS.skyTop);
  g.addColorStop(1, COLORS.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, roadTop);
}

function drawTrees(w, roadTop) {
  ctx.fillStyle = COLORS.treeFar;
  const farY = roadTop - 6;
  for (let x = -state.scroll.far; x < w + TREE_FAR_SPACING; x += TREE_FAR_SPACING) {
    drawTreeShape(x, farY, 24, 42);
  }
  ctx.fillStyle = COLORS.treeNear;
  const nearY = roadTop + 6;
  for (let x = -state.scroll.near; x < w + TREE_NEAR_SPACING; x += TREE_NEAR_SPACING) {
    drawTreeShape(x, nearY, 17, 32);
  }
}

function drawRoad(w, roadTop, roadHeight) {
  ctx.fillStyle = COLORS.road;
  ctx.fillRect(0, roadTop, w, roadHeight);
  ctx.strokeStyle = COLORS.roadLine;
  ctx.lineWidth = 4;
  ctx.setLineDash([ROAD_DASH * 0.5, ROAD_DASH * 0.5]);
  ctx.lineDashOffset = -state.scroll.road;
  const laneY = roadTop + roadHeight * 0.5;
  ctx.beginPath();
  ctx.moveTo(0, laneY);
  ctx.lineTo(w, laneY);
  ctx.stroke();
  ctx.setLineDash([]);
}

function carHeightFor(h) { return h * 0.16; }

function drawWheel(cx, cy, r, angle) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = "#111";
  ctx.fill();
  ctx.strokeStyle = "#555";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(angle) * r * 0.7, cy + Math.sin(angle) * r * 0.7);
  ctx.lineTo(cx - Math.cos(angle) * r * 0.7, cy - Math.sin(angle) * r * 0.7);
  ctx.stroke();
}

function drawCar(x, y, h, flashOn) {
  const carH = carHeightFor(h);
  const carW = carH * 2.1;
  const wheelR = carH * 0.22;
  const bounce = Math.sin(performance.now() / 120) * carH * (state.phase === "PLAYING" ? 0.03 : 0.01);
  const hop = state.hopMs != null
    ? -Math.sin(Math.min(1, state.hopMs / CONFIG.HOP) * Math.PI) * carH * 0.18
    : 0;

  ctx.save();
  ctx.translate(x, y + bounce + hop);

  ctx.fillStyle = flashOn ? COLORS.destructive : COLORS.primary;
  roundRect(0, carH * 0.25, carW, carH * 0.5, 8);
  ctx.fill();

  ctx.fillStyle = flashOn ? "#7f1d1d" : COLORS.primaryDark;
  roundRect(carW * 0.28, 0, carW * 0.42, carH * 0.32, 6);
  ctx.fill();

  const wheelY = carH * 0.78;
  drawWheel(carW * 0.24, wheelY, wheelR, state.wheelAngle);
  drawWheel(carW * 0.78, wheelY, wheelR, state.wheelAngle);

  ctx.restore();
}

function drawNitroFlame(x, y, h) {
  const carH = carHeightFor(h);
  const flicker = 0.7 + Math.random() * 0.3;
  ctx.save();
  ctx.translate(x - carH * 0.1, y + carH * 0.55);
  ctx.fillStyle = "rgba(56,189,248,0.85)";
  ctx.beginPath();
  ctx.moveTo(0, -carH * 0.12);
  ctx.lineTo(-carH * 0.9 * flicker, 0);
  ctx.lineTo(0, carH * 0.12);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(191,219,254,0.9)";
  ctx.beginPath();
  ctx.moveTo(0, -carH * 0.06);
  ctx.lineTo(-carH * 0.5 * flicker, 0);
  ctx.lineTo(0, carH * 0.06);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSpeedLines(w, h) {
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 2;
  for (let i = 0; i < 10; i++) {
    const y = (i / 10) * h * 0.6 + h * 0.08 + Math.sin(performance.now() / 300 + i) * 4;
    const len = 40 + Math.random() * 60;
    const xEnd = w * 0.15 + Math.random() * w * 0.7;
    ctx.beginPath();
    ctx.moveTo(xEnd + len, y);
    ctx.lineTo(xEnd, y);
    ctx.stroke();
  }
}

function wrapText(text, cx, cy, maxWidth, lineHeight) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const word of words) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  const totalH = lines.length * lineHeight;
  let y = cy - totalH / 2 + lineHeight / 2;
  for (const l of lines) {
    ctx.fillText(l, cx, y);
    y += lineHeight;
  }
}

function drawBarricade(w, h, carX, roadTop, crashMs) {
  const alpha = barricadeAlpha(crashMs);
  if (alpha <= 0) return;
  const bx = barricadeX(carX, crashMs);
  const bw = Math.min(w * 0.42, 220);
  const bh = h * 0.24;
  const by = roadTop - bh - 4;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.save();
  roundRect(bx, by, bw, bh, 6);
  ctx.clip();
  ctx.fillStyle = "#111";
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = COLORS.amber;
  const stripeW = 18;
  for (let sx = -bh; sx < bw + bh; sx += stripeW * 2) {
    ctx.beginPath();
    ctx.moveTo(bx + sx, by + bh);
    ctx.lineTo(bx + sx + stripeW, by + bh);
    ctx.lineTo(bx + sx + stripeW + bh, by);
    ctx.lineTo(bx + sx + bh, by);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = "#000";
  ctx.lineWidth = 3;
  roundRect(bx, by, bw, bh, 6);
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.max(12, bh * 0.17)}px system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  wrapText(state.crashPhraseText.toUpperCase(), bx + bw / 2, by + bh / 2, bw - 16, bh * 0.24);

  ctx.restore();
}

function drawRedVignette(w, h) {
  ctx.save();
  ctx.fillStyle = "rgba(239,68,68,0.25)";
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

function syncHud() {
  const heartCount = Math.min(state.lives, 5);
  const heartsText = "❤️".repeat(heartCount) + (state.lives > 5 ? " x" + state.lives : "");
  document.getElementById("hud-lives").textContent = heartsText || "—";
  document.getElementById("hud-speed").textContent = Math.round(effectiveSpeed()) + " km/h";
  document.getElementById("hud-distance").textContent = Math.round(state.distanceM) + " m";
  document.getElementById("nitro-badge").classList.toggle("hidden", !nitroActive());
}

function syncTimerBar() {
  const bar = document.getElementById("timer-bar");
  const pct = Math.max(0, Math.min(1, state.timeLeftMs / CONFIG.QUESTION_MS));
  bar.style.transform = `scaleX(${pct})`;
  bar.style.background = pct > 0.5 ? "var(--primary)" : pct > 0.2 ? "var(--amber)" : "var(--red)";
}

function render() {
  const w = cssW, h = cssH;
  if (!w || !h) return;
  ctx.clearRect(0, 0, w, h);

  const roadTop = h * 0.68;
  const roadHeight = h - roadTop;

  drawSky(w, roadTop);
  drawTrees(w, roadTop);
  drawRoad(w, roadTop, roadHeight);

  let shakeX = 0, shakeY = 0, flashOn = false, showVignette = false;
  if (state.phase === "CRASHING") {
    const cm = state.crashMs;
    if (!state.reducedMotion) {
      const s = shakeOffset(cm);
      shakeX = s.x; shakeY = s.y;
    } else {
      const c = CONFIG.CRASH;
      showVignette = cm >= c.APPROACH && cm <= c.APPROACH + c.SHAKE;
    }
    flashOn = carFlashOn(cm);
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  const carX = w * 0.22;
  const carY = roadTop - carHeightFor(h);
  drawCar(carX, carY, h, flashOn);

  if (nitroActive() && state.phase === "PLAYING") {
    drawNitroFlame(carX, carY, h);
    drawSpeedLines(w, h);
  }

  if (state.phase === "CRASHING") {
    drawBarricade(w, h, carX, roadTop, state.crashMs);
  }

  ctx.restore();

  if (showVignette) drawRedVignette(w, h);

  syncHud();
  syncTimerBar();
}

// ── Main loop ───────────────────────────────────────────────────────────
let rafId = null;
let lastT = null;

function frame(now) {
  if (lastT == null) lastT = now;
  let dt = now - lastT;
  lastT = now;
  if (dt > CONFIG.MAX_DT_MS) dt = CONFIG.MAX_DT_MS;
  update(dt);
  render();
  rafId = requestAnimationFrame(frame);
}

function ensureLoopRunning() {
  if (rafId != null) return;
  lastT = null;
  rafId = requestAnimationFrame(frame);
}

// ── Init ────────────────────────────────────────────────────────────────
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);
if (window.ResizeObserver) {
  new ResizeObserver(resizeCanvas).observe(canvasWrap);
}

render();

document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("restart-btn").addEventListener("click", restart);
poolEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".pool-word");
  if (btn) onPoolClick(Number(btn.dataset.id));
});
sentenceEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".slot");
  if (btn) onSlotClick(Number(btn.dataset.answerIndex));
});
</script>
